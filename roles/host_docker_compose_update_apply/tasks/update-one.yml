---
- name: Update and validate host Compose project
  block:
    - name: Validate host Compose project
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "{{ host_compose_item.project_dir }}"
          - config
          - --quiet
      changed_when: false

    - name: Pull host Compose images
      ansible.builtin.command:
        argv: [docker, compose, --project-directory, "{{ host_compose_item.project_dir }}", pull]
      changed_when: true

    - name: Recreate host Compose project with pulled images
      ansible.builtin.command:
        argv: [docker, compose, --project-directory, "{{ host_compose_item.project_dir }}", up, -d]
      changed_when: true

    - name: Read host Compose container identifiers
      ansible.builtin.command:
        argv: [docker, compose, --project-directory, "{{ host_compose_item.project_dir }}", ps, -q]
      register: host_docker_compose_update_apply_ids
      changed_when: false

    - name: Require at least one host Compose container
      ansible.builtin.assert:
        that: host_docker_compose_update_apply_ids.stdout_lines | length > 0

    # One line per container: "/name status health". Healthchecks report
    # "starting" for their start period, so wait until none are starting.
    - name: Wait for host Compose container healthchecks to settle
      ansible.builtin.command:
        argv: >-
          {{ ['docker', 'inspect', '--format',
              '{{.Name}} {{.State.Status}} '
              ~ '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}']
             + host_docker_compose_update_apply_ids.stdout_lines }}
      register: host_docker_compose_update_apply_states
      until: >-
        host_docker_compose_update_apply_states.rc == 0
        and host_docker_compose_update_apply_states.stdout_lines
            | select('search', ' starting$') | list | length == 0
      retries: "{{ host_docker_compose_update_apply_health_retries | default(24) }}"
      delay: "{{ host_docker_compose_update_apply_health_delay | default(5) }}"
      changed_when: false

    - name: Require every host Compose container to be running and healthy
      vars:
        host_docker_compose_update_apply_bad: >-
          {{ host_docker_compose_update_apply_states.stdout_lines
             | reject('match', '^\S+ running (healthy|none)$')
             | map('regex_replace', '^/', '')
             | list }}
      ansible.builtin.assert:
        that:
          - host_docker_compose_update_apply_bad | length == 0
        fail_msg: >-
          Not running/healthy after up -d (container status health):
          {{ host_docker_compose_update_apply_bad | join(', ') }}

    - name: Record successful host Compose update
      ansible.builtin.set_fact:
        host_docker_compose_update_apply_results: >-
          {{ host_docker_compose_update_apply_results + [{
             'target': host_compose_item.target, 'type': 'Docker',
             'status': 'SUCCESS', 'reboot_required': 'no', 'error': ''}] }}
  rescue:
    - name: Record failed host Compose update
      ansible.builtin.set_fact:
        host_docker_compose_update_apply_results: >-
          {{ host_docker_compose_update_apply_results + [{
             'target': host_compose_item.target, 'type': 'Docker',
             'status': 'FAILED', 'reboot_required': 'unknown',
             'error': ('task=' + (ansible_failed_task.name | default('unknown task'))
                       + '; rc=' + (ansible_failed_result.rc | default('n/a') | string)
                       + '; error=' + (ansible_failed_result.stderr
                           | default(ansible_failed_result.msg
                             | default(ansible_failed_result.stdout
                               | default('unknown error'), true), true)
                           | trim))}] }}
