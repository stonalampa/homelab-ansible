---
- name: Exercise sanitized JSON report generation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_remote_tmp: /tmp/homelab-json-report-remote
    update_report_generated_at: "2030-01-01T00:00:00Z"
    update_report_path: "{{ lookup('env', 'REPORT_TEST_PATH') }}"
    update_all_results:
      - target: example-target
        type: Docker
        status: FAILED
        reboot_required: unknown
        error: container state validation failed
  tasks:
    - name: Exercise production JSON report tasks
      ansible.builtin.include_tasks: ../playbooks/tasks/write-json-report.yml
