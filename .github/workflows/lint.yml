---
name: Lint and syntax

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install validation tools
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run offline validation
        run: ./tests/offline-check.sh

      - name: Run disposable Linux integration tests
        run: ./tests/integration-test.sh
